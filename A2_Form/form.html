 <body>

            important updates. </p>
        <p><b>Name</b></p>
        <input type="text" class="input" placeholder="Enter your first name">

        <input type="text" class="input" placeholder="Enter your email address">

        <input type="text" class="input" placeholder="Create a password">
        <br>
        <br>
        <label class="container">
          <input type="checkbox" checked="checked"> 
          I consent to receive email communications from Sea turtles Worldwide and can unsubscribe at any time.
          <span class="checkmark"></span>
        </label>
        <br>
        <input type="submit" value="Submit">
